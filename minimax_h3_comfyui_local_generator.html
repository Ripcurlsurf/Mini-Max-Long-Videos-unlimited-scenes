<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minimax-H3 ComfyUI Local Workflow Generator</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#14161a;color:#d8dbe0;font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:10px 16px;background:#1c1f25;border-bottom:1px solid #2c313a}
header h1{margin:0;font-size:16px}header small{color:#8a93a0}
.bar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;background:#1c1f25;border-bottom:1px solid #2c313a}
button{background:#2b6cb0;color:#fff;border:0;border-radius:4px;padding:6px 10px;cursor:pointer;font:inherit}
button.s{background:#3a404b}button:hover{filter:brightness(1.15)}
main{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px;padding:14px 16px}
@media(max-width:900px){main{grid-template-columns:1fr}}
section{background:#1c1f25;border:1px solid #2c313a;border-radius:6px;padding:10px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:13px;color:#9db4d0}
label{display:block;margin:6px 0 2px;color:#a9b0bb}
input,textarea,select{width:100%;background:#101216;color:#e6e8eb;border:1px solid #333a45;border-radius:4px;padding:5px;font:inherit}
input[type=checkbox]{width:auto;margin-right:6px}
textarea{resize:vertical;min-height:54px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 10px}
.cb{display:flex;align-items:center;margin-top:8px}.cb label{margin:0}
.sc,.rc{border:1px solid #333a45;border-radius:5px;padding:8px;margin-bottom:8px;background:#171a1f}
.sc b,.rc b{color:#9db4d0}.fr{color:#8fd19e;font-size:12px}
.err{color:#ff8a8a}.wrn{color:#f0c674}.ok{color:#8fd19e}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12px ui-monospace,Consolas,monospace}
#out{min-height:160px;font:11px ui-monospace,Consolas,monospace}
.kx{display:none;margin-top:6px}body.kon .kx{display:block}
</style></head><body>
<header><h1>Minimax-H3 &rarr; ComfyUI workflow generator</h1>
<small>100% offline &middot; RAM 192 GB &middot; VRAM 32 GB &middot; single local GPU &middot; emits ComfyUI frontend (UI) JSON only</small></header>
<div class="bar">
<button id="bAdd">Add Scene</button><button id="bRem" class="s">Remove Scene</button><button id="bEx" class="s">Load Example</button><button id="bTpl" class="s">Generate Template</button><button id="bUp" class="s">Upload Filled Template</button><input type="file" id="tplFile" accept=".json,.txt,application/json,text/plain" style="display:none"><span id="tplMsg" style="font-size:12px;margin-left:8px"></span>
<button id="bGen">Generate Workflow JSON</button><button id="bCopy">Copy Workflow JSON</button><button id="bDl">Download Workflow JSON</button><button id="bPlan" class="s" style="display:none">Download Plan JSON</button><button id="bFF" class="s" style="display:none">Download ffmpeg script</button>
</div>
<main><div>
<section><h2>Prompts</h2>
<label>1. Reference images (character / location / style sheets)</label><div id="refs"></div><div style="margin-top:6px"><button class="s" id="bRef">Add reference image</button> <button class="s" id="bRefRm">Remove last</button></div><div class="cb"><input type="checkbox" id="rfirst"><label for="rfirst">Use the first reference with a filename as the scene 1 first frame (when none is set)</label></div>
<label>2. Negative prompt</label><textarea id="neg">low quality, blurry, distorted faces, extra limbs, watermark, text, flickering, jitter, bad anatomy, oversaturated, noisy, artifacts</textarea></section>
<section><h2>3. Scenes</h2><div id="scenes"></div></section>
<section><h2>First frame, audio, LoRA</h2><div class="g">
<div><label>4. First frame mode</label><select id="mode"><option>global_first_frame_scene1_only</option><option>per_scene_manual</option><option selected>last_frame_chain</option></select></div>
<div><label>5. Global first frame filename</label><input id="gff" placeholder="optional.png"></div>
<div><label>Scene 1 reference source</label><select id="rs"><option value="upload">Uploaded photo (filename at left)</option><option value="gen">Generate from text prompt</option></select></div>
<div><label>Prompt for generated first frame (blank = main + scene 1)</label><textarea id="gp" style="min-height:40px"></textarea></div>
<div><label>9. LoRA strength</label><input id="ls" type="number" value="0.75" min="0" max="2" step="0.05"></div>
<div><label>10. Video VAE</label><select id="vae"><option>minimax_h3_video_vae_int8_convrot</option><option>minimax_h3_video_vae_fp16</option></select></div></div>
<div class="cb"><input type="checkbox" id="aud"><label for="aud">6. Audio enabled</label></div>
<div class="cb"><input type="checkbox" id="lora"><label for="lora">7. LoRA enabled</label></div>
<div class="cb"><input type="checkbox" id="turbo"><label for="turbo">8. Turbo 4-step mode</label></div></section>
<section><h2>Consistency &amp; long-form options (each can be switched off)</h2>
<div class="cb"><input type="checkbox" id="kf"><label for="kf">A. First + last keyframes per scene (N+1 shared keyframes from your image model)</label></div>
<div class="g"><div><label>Keyframe filename pattern ({n} = 001, 002...)</label><input id="kfp" value="keyframe_{n}.png"></div>
<div><label>Render scenes from</label><input id="rf" type="number" min="1" placeholder="1"></div><div><label>to</label><input id="rt" type="number" min="1" placeholder="last"></div></div>
<div class="cb"><input type="checkbox" id="bib"><label for="bib">B. Inject consistency bible into every scene prompt</label></div>
<label>Style line</label><textarea id="bst"></textarea>
<label>Character bible (one per line: Name: look; voice)</label><textarea id="bch"></textarea>
<label>Global sound-design line</label><input id="bsn">
<div class="cb"><input type="checkbox" id="ext"><label for="ext">C. Dialogue by external TTS (H3 audio = ambience/effects only)</label></div>
<div class="cb"><input type="checkbox" id="nj"><label for="nj">D. Skip in-graph join (join with ffmpeg; saves RAM on long films)</label></div>
<div class="cb"><input type="checkbox" id="exp"><label for="exp">E. Enable plan JSON + ffmpeg assemble script export</label></div>
<div class="cb"><input type="checkbox" id="rm"><label for="rm">G. Reference-to-video mode (MiniMaxH3ReferenceToVideo + ref2va model; references go in as &lt;Picture N&gt; inputs, no first/last frame)</label></div>
<div class="g"><div><label>Ref2va diffusion model file</label><input id="un2" value="minimax_h3_ref2va_pruned_int8_convrot.safetensors"></div><div><label>ref_image_size</label><select id="ris"><option>match</option><option>max</option></select></div></div>
<div class="cb"><input type="checkbox" id="rauto"><label for="rauto">Only link references whose name appears in the scene prompt/dialogue (off = every scene gets all references)</label></div>
<div class="cb"><input type="checkbox" id="sg" checked><label for="sg">I. Pack each scene into a subgraph node (far fewer nodes, keeps ComfyUI responsive on long films)</label></div>
<div class="cb"><input type="checkbox" id="lk" checked><label for="lk">H. Force scenes to generate strictly in order (adds a hidden dependency link from each scene to the previous one)</label></div>
<div class="cb"><input type="checkbox" id="rg"><label for="rg">F. Generate reference images in the workflow (Qwen Image 2.1 text-to-image)</label></div>
<div class="g"><div><label>Qwen diffusion model file</label><input id="qun" value="qwen_image_2.1_int8_convrot.safetensors"></div><div><label>Qwen text encoder file</label><input id="qte" value="qwen3vl_8b_int8_convrot.safetensors"></div><div><label>Qwen VAE file</label><input id="qvae" value="qwen_image_2.1_vae_bf16.safetensors"></div><div><label>Reference width</label><input id="rw" type="number" value="1024"></div><div><label>Reference height</label><input id="rh" type="number" value="1024"></div><div><label>Steps (official 40-50 with euler)</label><input id="rst" type="number" value="25"></div><div><label>CFG</label><input id="rcfg" type="number" step="0.1" value="1"></div></div></section>
<section><h2>Video and sampling</h2><div class="g">
<div><label>11. Width</label><input id="w" type="number" value="512"></div>
<div><label>12. Height</label><input id="h" type="number" value="288"></div>
<div><label>13. FPS</label><input id="fps" type="number" value="24"></div>
<div><label>14. Default scene duration (s)</label><input id="dd" type="number" value="15"></div>
<div><label>15. Optional duration warning threshold (s, blank = none)</label><input id="mx" type="number" value="" placeholder="no limit"></div>
<div><label>16. Steps</label><input id="steps" type="number"></div>
<div><label>17. CFG</label><input id="cfg" type="number" step="0.1"></div>
<div><label>18. Sampler</label><select id="smp"><option>euler</option><option>euler_cfg_pp</option><option>euler_ancestral</option><option>euler_ancestral_cfg_pp</option><option>heun</option><option>heunpp2</option><option>dpm_2</option><option>dpm_2_ancestral</option><option>lms</option><option>dpm_fast</option><option>dpm_adaptive</option><option>dpmpp_2s_ancestral</option><option>dpmpp_sde</option><option>dpmpp_2m</option><option>dpmpp_2m_cfg_pp</option><option>dpmpp_2m_sde</option><option>dpmpp_3m_sde</option><option>ddpm</option><option>lcm</option><option>ipndm</option><option>ipndm_v</option><option>deis</option><option selected>res_multistep</option><option>res_multistep_cfg_pp</option><option>res_multistep_ancestral</option><option>gradient_estimation</option><option>er_sde</option><option>seeds_2</option><option>seeds_3</option><option>sa_solver</option><option>ddim</option><option>uni_pc</option><option>uni_pc_bh2</option></select></div>
<div><label>19. Scheduler</label><select id="sch"><option selected>simple</option><option>sgm_uniform</option><option>karras</option><option>exponential</option><option>ddim_uniform</option><option>beta</option><option>normal</option><option>linear_quadratic</option><option>kl_optimal</option></select></div>
<div><label>Denoise (0-1)</label><input id="dn" type="text" inputmode="decimal" value="1.0"></div>
<div><label>20. Seed mode</label><select id="sm"><option>same_seed_for_all_scenes</option><option>random_seed_per_scene</option></select></div>
<div><label>21. Base seed</label><input id="bs" type="number" value="-1"></div>
<div><label>22. Batch size</label><input id="bat" type="number" value="1" min="1"></div>
<div><label>Text encoder file (needs 5120-dim, the 32B)</label><input id="te" value="qwen3vl_32b_heretic_minimax_h3_nvfp4.safetensors"></div>
<div><label>Diffusion model file</label><input id="un" value="minimax_h3_fl2va_bf16.safetensors"></div>
<div><label>24. Final output filename</label><input id="fin" value="minimax_h3_final_video.mp4"></div></div>
<div class="cb"><input type="checkbox" id="ec" checked><label for="ec">EasyCache (speeds up sampling)</label></div>
<div class="cb"><input type="checkbox" id="sage" checked><label for="sage">Sage Attention (needs KJNodes + sageattention installed)</label></div>
<div class="cb"><input type="checkbox" id="sv" checked><label for="sv">Save individual scene MP4s (previews only, never the final result)</label></div></section>
</div><div>
<section><h2>Preview</h2><pre id="pv"></pre></section>
<section><h2>Workflow JSON <button id="bCopy2" style="float:right">Copy</button></h2><textarea id="out" readonly></textarea></section>
</div></main>
<script>
(function(){
"use strict";
const $=i=>document.getElementById(i);
const DESC={LoraLoaderModelOnly:"ComfyUI core LoRA loader; NOT present in the reference workflow, verify it loads the turbo LoRA"};
let cnt=0;
function addScene(p,d,f,s){
 cnt++;const c=document.createElement("div");c.className="sc";
 c.innerHTML='<b></b><label>Scene prompt</label><textarea class="sp"></textarea><div class="g"><div><label>Duration (s)</label><input class="sd" type="number" step="0.5"></div><div><label>First frame filename (optional)</label><input class="sf"></div><div><label>Seed (empty = inherit)</label><input class="ss" type="number"></div></div><div class="kx"><div class="g"><div><label>Last frame filename (optional)</label><input class="sl"></div><div class="cb"><input type="checkbox" class="sk"><label>Hard cut before this scene</label></div></div><label>Dialogue (one per line, Speaker: line)</label><textarea class="sdl"></textarea><label>Scene sound design (optional)</label><input class="ssn"><label>Reference images for this scene (numbers or names; blank = auto)</label><input class="srr"></div><div class="fr"></div>';
 c.querySelector(".sp").value=p||"";c.querySelector(".sd").value=d||$("dd").value||15;
 c.querySelector(".sf").value=f||"";c.querySelector(".ss").value=s==null?"":s;
 $("scenes").appendChild(c);renum();
}
function renum(){[...document.querySelectorAll(".sc")].forEach((c,i)=>c.querySelector("b").textContent="Scene "+(i+1));}
function scenes(){return [...document.querySelectorAll(".sc")].map(c=>({p:c.querySelector(".sp").value.trim(),d:parseFloat(c.querySelector(".sd").value),f:c.querySelector(".sf").value.trim(),s:c.querySelector(".ss").value.trim(),l:c.querySelector(".sl").value.trim(),k:c.querySelector(".sk").checked,dl:c.querySelector(".sdl").value.trim(),sn:c.querySelector(".ssn").value.trim(),rr:c.querySelector(".srr").value.trim(),el:c}));}
function autofill(){
 const t=$("turbo").checked;
 $("steps").value=t?4:20;$("cfg").value=t?1.0:5.0;
}
function vl(sec,fps){const r=Math.max(5,Math.round(sec*fps));return 17*Math.ceil((r-5)/17)+5;}
function build(){
 const E=[],W=[],S0=scenes(),w=+$("w").value,h=+$("h").value,fps=+$("fps").value;
 const mode=$("mode").value,aud=$("aud").checked,lora=$("lora").checked,turbo=$("turbo").checked;
 const g=$("gff").value.trim()||refFirst(),main="",mxv=$("mx").value.trim();
 const RM=$("rm").checked,kfOn=$("kf").checked&&!RM,bib=$("bib").checked,ext=$("ext").checked,nj=$("nj").checked;
 const kn=n=>($("kfp").value.trim()||"keyframe_{n}.png").replace("{n}",String(n).padStart(3,"0"));
 let kc=1;S0.forEach((s,i)=>{s.gi=i;if(!kfOn)return;const cut=i===0||s.k;s.sf=s.f||(cut?kn(kc++):S0[i-1].lf);s.lf=s.l||kn(kc++);});
 const rf=parseInt($("rf").value,10)||1,rt=parseInt($("rt").value,10)||S0.length;
 const S=S0.filter((s,i)=>i+1>=rf&&i+1<=rt);
 if(!S.length)E.push("Scene range selects no scenes.");
 const chars=$("bch").value.split("\n").map(x=>x.trim()).filter(Boolean).concat(refs().filter(r=>r.n&&r.d).map(r=>r.n+": "+r.d));
 const compose=s=>{let b=main&&s.p?main+". "+s.p:(main||s.p),x=[];
  if(bib){const st=$("bst").value.trim();if(st)x.push("Style: "+st);
   const hay=(s.p+" "+s.dl).toLowerCase(),m=chars.filter(c=>hay.includes(c.split(":")[0].trim().toLowerCase()));
   (m.length?m:chars).forEach(c=>x.push("Character "+c));
   const gs=$("bsn").value.trim();if(gs)x.push("Sound: "+gs);}
  if(s.sn)x.push("Scene sound: "+s.sn);
  if(aud){if(ext)x.push("No spoken dialogue, no speech; ambience, effects and music only");else s.dl.split("\n").map(l=>l.trim()).filter(Boolean).forEach(l=>x.push("Spoken line, "+l));}
  return x.length?b+". "+x.join(". ")+".":b;};
 const fin=($("fin").value.trim()||"minimax_h3_final_video.mp4"),base=fin.replace(/\.mp4$/i,"");
 const dnr=$("dn").value.trim(),dnv=dnr===""?1:parseFloat(dnr);
 if(!(dnv>0&&dnv<=1))E.push("Denoise must be a number above 0 and up to 1.");
 if(S.length<1)E.push("At least 1 scene is required.");
 if(!main&&!S.some(s=>s.p))E.push("All prompts are empty: fill at least one scene prompt.");
 if(!(w>0))E.push("Width must be > 0.");if(!(h>0))E.push("Height must be > 0.");if(!(fps>0))E.push("FPS must be > 0.");
 S.forEach((s,i)=>{if(!(s.d>0))E.push("Scene "+(i+1)+": duration must be > 0.");
  s.fr=vl(s.d||0,fps);s.el.querySelector(".fr").textContent="Valid H3 frame count (17k+5) at "+fps+" fps: "+s.fr+(kfOn?" | keyframes: "+s.sf+" -> "+s.lf:"");
  s.c=compose(s);});
 const total=S.reduce((a,s)=>a+(s.d||0),0),frames=S.reduce((a,s)=>a+(s.fr||0),0);
 if(mxv!==""&&total>+mxv)W.push("Total duration "+total+"s is above your warning threshold of "+mxv+"s (not blocking).");

 W.push("Negative prompt and CFG are not wired: the reference graph uses BasicGuider (no CFG).");

 let nid=0,lid=0;const nodes=[],links=[],ph={};
 const N=(type,title,x,y,wv,ins,outs)=>{const n={id:++nid,type:type,pos:[x,y],size:[300,120],flags:{},order:nid-1,mode:0,
  inputs:ins.map(a=>Object.assign({name:a[0],type:a[1],link:null},a[2]||{})),
  outputs:outs.map((a,i)=>({name:a[0],type:a[1],links:[],slot_index:i})),title:title,
  properties:{"Node name for S&R":type},widgets_values:wv};
  nodes.push(n);if(DESC[type])ph[type]=DESC[type];return n;};
 const L=(a,as,b,bs)=>{const id=++lid;links.push([id,a.id,as,b.id,bs,a.outputs[as].type]);a.outputs[as].links.push(id);b.inputs[bs].link=id;};
 const X=".safetensors",M=["model","MODEL"],V=["vae","VAE"],WI=k=>[k,"INT",{widget:{name:k}}];
 const un=N("UNETLoader","UNET",-2200,100,[(RM?$("un2").value.trim():$("un").value.trim()),"default"],[],[["MODEL","MODEL"]]);
 const ck=N("CLIPLoader","CLIP",-2200,300,[$("te").value.trim(),"minimax","default"],[],[["CLIP","CLIP"]]);
 const vv=N("VAELoader","Video VAE",-2200,500,[$("vae").value+X],[],[["VAE","VAE"]]);
 const av=(aud||RM)?N("VAELoader","Audio VAE",-2200,700,["minimax_h3_audio_vae_fp32"+X],[],[["VAE","VAE"]]):null;
 let m=un;
 if(lora){const lo=N("LoraLoaderModelOnly","Turbo LoRA",-1950,-250,[(RM?"minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16":"minimax_h3_fl2v_lightx2v_turbo_4step_v0.1_comfy")+X,+$("ls").value],[M],[["MODEL","MODEL"]]);L(m,0,lo,0);m=lo;}
 let fm=m;
 if($("ec").checked){const ec=N("EasyCache","EasyCache",-1700,-100,[0.3,0.2,0.9,false],[M],[["MODEL","MODEL"]]);L(fm,0,ec,0);fm=ec;}
 if($("sage").checked){const sg=N("PathchSageAttentionKJ","Sage Attention",-1300,-80,["auto",false],[M],[["MODEL","MODEL"]]);L(fm,0,sg,0);fm=sg;}
 const ks=N("KSamplerSelect","Sampler",-1700,100,[$("smp").value],[],[["SAMPLER","SAMPLER"]]);
 const rnd=Math.floor(Math.random()*4294967295),bs=parseInt($("bs").value,10),bsv=isNaN(bs)?-1:bs;
 let refImg=null;
 const RA=refs(),RG=$("rg").checked,RL=RA.filter(r=>r.d||r.n);
 if(RG&&!RL.length)W.push("Reference generation (F) is on but no reference has a name or description.");
 if(RG&&RL.length){
  W.push("Reference generation uses the Qwen Image 2.1 nodes from your template (TextEncodeQwenImage21, QwenImage21Cache, KSampler, SaveImageAdvanced); the prompt enhancer is not included. CFG 1 ignores the negative prompt. Images save to ComfyUI/output/ref/; copy them into ComfyUI/input to reuse them as LoadImage files.");
  const qu=N("UNETLoader","Qwen Image 2.1 UNET",-2200,-2600,[$("qun").value.trim(),"default"],[],[["MODEL","MODEL"]]);
  const qm=N("QwenImage21Cache","Qwen Image 2.1 Cache",-1900,-2600,["auto","default"],[M],[["MODEL","MODEL"]]);L(qu,0,qm,0);
  const qc=N("CLIPLoader","Qwen Image 2.1 CLIP",-2200,-2400,[$("qte").value.trim(),"qwen_image","default"],[],[["CLIP","CLIP"]]);
  const qv=N("VAELoader","Qwen Image 2.1 VAE",-2200,-2200,[$("qvae").value.trim()],[],[["VAE","VAE"]]);
  const rw=+$("rw").value||1024,rh=+$("rh").value||1024,sty=$("bst").value.trim();
  RL.forEach((r,i)=>{const x=-1600+i*600,k=i+1;
   const te=N("TextEncodeQwenImage21","Ref "+k+" Prompt",x,-2600,[(r.d||r.n)+(sty?". "+sty:""),$("neg").value.trim(),1024],[["clip","CLIP"],["images.image_1","IMAGE",{shape:7}],["vae","VAE",{shape:7}],["prompt","STRING",{widget:{name:"prompt"}}],["negative_prompt","STRING",{widget:{name:"negative_prompt"}}]],[["positive","CONDITIONING"],["negative","CONDITIONING"],["latent","LATENT"]]);L(qc,0,te,0);
   const el=N("EmptyLatentImage","Ref "+k+" Latent",x,-2300,[rw,rh,1],[],[["LATENT","LATENT"]]);
   const kk=N("KSampler","Ref "+k+" Sampler",x,-2150,[bsv<0?rnd+i:bsv+i,"fixed",+$("rst").value||25,+$("rcfg").value||1,"euler","simple",1],[M,["positive","CONDITIONING"],["negative","CONDITIONING"],["latent_image","LATENT"]],[["LATENT","LATENT"]]);
   L(qm,0,kk,0);L(te,0,kk,1);L(te,1,kk,2);L(el,0,kk,3);
   const dc=N("VAEDecode","Ref "+k+" Decode",x,-1900,[],[["samples","LATENT"],V],[["IMAGE","IMAGE"]]);L(kk,0,dc,0);L(qv,0,dc,1);
   const sv=N("SaveImageAdvanced","Save Ref "+k,x,-1750,["ref/"+(r.f||("reference_"+k)).replace(/\.[a-z0-9]+$/i,""),"png","8-bit","sRGB"],[["images","IMAGE"]],[]);L(dc,0,sv,0);

function tplGet(){
 const sp=t=>t.split("\n").map(x=>x.trim()).filter(Boolean),ch=sp($("bch").value);
 const rf=refs().map(r=>({name:r.n,filename:r.f,description:r.d}));
 const sc=scenes().map(x=>({prompt:x.p,duration_s:x.d>0?x.d:(+$("dd").value||15),first_frame:x.f,last_frame:x.l,hard_cut:x.k,dialogue:sp(x.dl),sound:x.sn,references:x.rr,seed:x.s===""?null:Number(x.s)}));
 return {_instructions:[
 "HOW TO USE: fill in this JSON template and return ONLY the completed JSON (no commentary, no markdown). Keep every key and the exact structure; do not rename keys. Keys starting with _ are ignored.",
 "story_brief is the premise or long prompt written by the user. Expand it into a full scene list. target_runtime_minutes: make the sum of all scene duration_s match it.",
 "scenes: one object per continuous clip, in story order. prompt = what is seen plus camera movement, present tense, concrete visual detail. Use character and location names exactly as in reference_images[].name so they stay consistent. Do not put dialogue in prompt.",
 "duration_s: normally 5 to 15 seconds. The generator rounds each clip up to a valid frame count automatically.",
 "dialogue: array of strings formatted 'Speaker: line'. sound: short ambience / foley / music note for the scene. Leave empty if none.",
 "hard_cut: true when the scene starts a new shot or location (matters when options.keyframes is true). first_frame and last_frame: leave empty unless the user supplied image filenames.",
 "reference_images: one entry per character, location or style sheet. name = short label; description = look, outfit and voice (also the image-generation prompt when options.generate_reference_images is true); filename = image name in ComfyUI input (empty if generating). At most 9 are used per scene.",
 "scenes[].references: optional list such as '1,3' or names to limit which reference images a scene uses; empty means all references.",
 "consistency: style_line = one sentence of visual style shared by every scene; character_bible = array of 'Name: look; voice' lines; global_sound = one line of overall sound design.",
 "settings and options: keep the current values unless the user asks for a change."],
 story_brief:"",target_runtime_minutes:null,
 settings:{width:+$("w").value,height:+$("h").value,fps:+$("fps").value,default_scene_duration_s:+$("dd").value,output_name:$("fin").value,negative_prompt:$("neg").value,first_frame_mode:$("mode").value},
 options:{audio:$("aud").checked,reference_mode:$("rm").checked,keyframes:$("kf").checked,consistency_bible:$("bib").checked,external_tts:$("ext").checked,skip_in_graph_join:$("nj").checked,generate_reference_images:$("rg").checked,plan_export:$("exp").checked},
 consistency:{style_line:$("bst").value.trim(),character_bible:ch.length?ch:["Name: look; voice"],global_sound:$("bsn").value.trim()},
 reference_images:rf.some(r=>r.name||r.filename||r.description)?rf:[{name:"",filename:"",description:""}],
 scenes:sc};}
function tplLoad(txt){
 let t=txt.trim().replace(/^```[a-z]*\s*/i,"").replace(/```\s*$/,"");
 const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<a)throw new Error("No JSON object found in the file.");
 const d=JSON.parse(t.slice(a,b+1)),warn=[];
 if(d.nodes&&d.links)throw new Error("this is a ComfyUI workflow, not a project template. Use Generate Template, have your AI fill it in, then upload that file.");
 const set=(id,v)=>{if(typeof v==="string"||(typeof v==="number"&&isFinite(v)))$(id).value=v;};
 const ck=(id,v)=>{if(typeof v==="boolean")$(id).checked=v;};
 const lines=v=>Array.isArray(v)?v.map(x=>String(x).trim()).filter(Boolean).join("\n"):(typeof v==="string"?v:"");
 const S=d.settings||{},O=d.options||{},C=d.consistency||{};
 [["w","width"],["h","height"],["fps","fps"],["dd","default_scene_duration_s"],["fin","output_name"],["neg","negative_prompt"]].forEach(k=>{if(S[k[1]]!==undefined&&S[k[1]]!==null)set(k[0],S[k[1]]);});
 if([...$("mode").options].some(o=>o.value===S.first_frame_mode))$("mode").value=S.first_frame_mode;
 [["aud","audio"],["rm","reference_mode"],["kf","keyframes"],["bib","consistency_bible"],["ext","external_tts"],["nj","skip_in_graph_join"],["rg","generate_reference_images"],["exp","plan_export"]].forEach(k=>ck(k[0],O[k[1]]));
 if(C.style_line!==undefined)$("bst").value=lines(C.style_line);
 if(C.character_bible!==undefined)$("bch").value=lines(C.character_bible);
 if(C.global_sound!==undefined)$("bsn").value=lines(C.global_sound);
 let nr=0,ns=0;
 if(Array.isArray(d.reference_images)){$("refs").innerHTML="";
  d.reference_images.forEach(r=>{if(!r||!(r.name||r.filename||r.description))return;addRef(String(r.name||""),String(r.filename||""),String(r.description||""));nr++;});
  if(!nr)addRef();}
 if(Array.isArray(d.scenes)&&d.scenes.length){$("scenes").innerHTML="";cnt=0;
  d.scenes.forEach((x,i)=>{x=x||{};const dur=Number(x.duration_s)>0?Number(x.duration_s):null,sd=x.seed===null||x.seed===undefined||x.seed===""||!isFinite(Number(x.seed))?null:Number(x.seed);
   if(!x.prompt)warn.push("scene "+(i+1)+" has no prompt");
   addScene(String(x.prompt||""),dur,String(x.first_frame||""),sd);
   const c=[...document.querySelectorAll(".sc")].pop();
   c.querySelector(".sl").value=String(x.last_frame||"");c.querySelector(".sk").checked=!!x.hard_cut;
   c.querySelector(".sdl").value=lines(x.dialogue);c.querySelector(".ssn").value=String(x.sound||"");
   c.querySelector(".srr").value=Array.isArray(x.references)?x.references.join(","):String(x.references||"");ns++;});}
 else warn.push("no scenes found; existing scenes were kept");
 refresh();
 return "Loaded "+ns+" scene(s) and "+nr+" reference image(s)."+(warn.length?" Check: "+warn.slice(0,5).join("; ")+".":"")+" Review, then generate/download the workflow.";}
$("bTpl").onclick=()=>{dl("h3_project_template.json",JSON.stringify(tplGet(),null,2),"application/json");$("tplMsg").textContent="Template downloaded. Give it to your AI with your story, then upload the result.";};

 r.onerror=()=>{$("tplMsg").textContent="Could not read the file.";};r.readAsText(f);};
